name: CI Gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  gate:
    permissions:
      contents: read
      pull-requests: read
      # The hub gate's queue watchdog cancels stuck sibling jobs, which
      # needs `actions: write`; a called workflow cannot exceed the
      # caller's grant, so it must be granted here.
      actions: write
    uses: dryvist/.github/.github/workflows/_ci-gate.yml@main
    with:
      markdown_lint: true
      file_size: true
      filters: |
        markdown:
          - '**.md'
          - '.markdownlint*'
